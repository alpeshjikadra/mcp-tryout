version: '3.8'

# Database services removed for simplified testing
# The MCP server now runs without any database dependencies

services:
  # PostgreSQL service (optional, for future use if needed)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: mcp-postgres
  #   environment:
  #     POSTGRES_DB: mcpdb
  #     POSTGRES_USER: mcpuser
  #     POSTGRES_PASSWORD: mcppass
  #     POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./init-scripts:/docker-entrypoint-initdb.d
  #   networks:
  #     - mcp-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U mcpuser -d mcpdb"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # MCP Server (example configuration for Docker deployment)
  mcp-server:
    build: .
    container_name: mcp-server
    environment:
      KYLAS_API_KEY: ${KYLAS_API_KEY:-your-api-key-here}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: mcp-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@mcp.local
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "8081:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   networks:
  #     - mcp-network
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  mcp-network:
    driver: bridge
